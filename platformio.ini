; 0sixty -- GPS Performance/Trip Tracker firmware for M5Stack Cardputer ADV
; See README.md for the design overview and CHANGELOG.md for version history.

[env:cardputer]
platform = espressif32
board = m5stack-stamps3          ; Cardputer is built on the M5StampS3 module; no dedicated board id exists
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

lib_deps =
	m5stack/M5Cardputer @ ^1.0.2
	mikalhart/TinyGPSPlus @ ^1.1.0
	bblanchon/ArduinoJson @ ^7.2.0
	esp32async/ESPAsyncWebServer @ ^3.12.1
	ricmoo/QRCode @ ^0.0.1

build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
